[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
"""
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
## {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }})){% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.remote.pr_number }}){% endif %}
{% endfor %}

{% endfor -%}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
filter_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^(build|ci|chore)", group = "Maintenance" },
    { message = "^revert", group = "Reverts" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
