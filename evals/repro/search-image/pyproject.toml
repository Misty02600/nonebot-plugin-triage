[project]
name = "triage-repro-search-image"
version = "0.1.0"
description = "Isolated YetAnotherPicSearch reproduction bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "YetAnotherPicSearch==2.0.10",
    "nonebot2[fastapi,httpx,websockets]>=2.5,<2.6",
    "nonebot-adapter-onebot>=2.4,<2.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
test = [
    "nonebug>=0.4.3,<1",
    "pytest-asyncio>=1.3,<2",
]
