[project]
name = "nonebot-plugin-triage"
version = "0.1.0"
description = "Evidence-first support and incident triage agent for NoneBot deployments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Misty" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "nonebot2>=2.5,<2.6",
    "nonebot-plugin-alconna>=0.62,<0.63",
    "pydantic>=2.11",
]

[project.urls]
Homepage = "https://github.com/Misty02600/nonebot-plugin-triage"
Repository = "https://github.com/Misty02600/nonebot-plugin-triage"
Documentation = "https://github.com/Misty02600/nonebot-plugin-triage#readme"

[project.optional-dependencies]
model-anthropic = [
    "anthropic==0.121.0",
    "pydantic-ai-slim[anthropic]==2.27.0",
]
model-openai = [
    "openai==2.53.0",
    "pydantic-ai-slim[openai]==2.27.0",
]
onebot = [
    "nonebot-adapter-onebot>=2.4,<2.5",
]

[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[dependency-groups]
maintainer = [
    "mlflow==3.14.0",
    "openai==2.53.0",
    "pydantic-ai-slim[openai]==2.27.0",
]
dev = [
    "anthropic==0.121.0",
    "commitizen>=4.1.0,<5.0.0",
    "git-cliff>=2.11.0,<3.0.0",
    { include-group = "test" },
    "nb-cli>=1.4.2,<2.0.0",
    "openai==2.53.0",
    "prek>=0.2.0,<1.0.0",
    "pydantic-ai-slim[anthropic,openai]==2.27.0",
    "twine>=6.2.0,<7.0.0",
]
test = [
    "basedpyright>=1.31.0",
    "nonebot-adapter-onebot>=2.4,<2.5",
    "nonebot2[fastapi]>=2.5,<2.6",
    "nonebug>=0.4.3,<1.0.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.3.0,<1.4.0",
    "ruff>=0.14.13,<1.0.0",
]

[tool.nonebot.plugins]
nonebot-plugin-triage = ["nonebot_plugin_triage"]

[tool.hatch.build.targets.wheel]
packages = ["src/nbtriage", "src/nonebot_plugin_triage"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.code-notes",
    "/.learning",
    "/.tours/personal",
    "/AGENTS.md",
    "/artifacts",
    "/data",
    "/docs/evaluations",
    "/docs/operations",
    "/docs/oracle-runs",
    "/docs/scratch",
    "/evals/snapshots",
    "/logs",
    "/mlartifacts",
    "/mlruns",
    "/reports",
    "/tools",
]
