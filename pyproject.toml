[project]
name = "nonebot-plugin-triage"
version = "0.1.0"
description = "Evidence-first support and incident triage agent for NoneBot deployments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Misty" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ast-grep-py==0.45.1",
    "nonebot2>=2.5,<2.6",
    "nonebot-plugin-alconna>=0.62,<0.63",
    "nonebot-plugin-localstore>=0.7.4,<0.8",
    "pydantic>=2.11",
    "pyyaml>=6.0.3,<7",
]

[project.urls]
Homepage = "https://github.com/Misty02600/nonebot-plugin-triage"
Repository = "https://github.com/Misty02600/nonebot-plugin-triage"
Documentation = "https://github.com/Misty02600/nonebot-plugin-triage#readme"

[project.optional-dependencies]
anthropic = [
    "jedi==0.20.0",
    "pydantic-ai-harness==0.20.0",
    "pydantic-ai-slim[anthropic]==2.28.0",
]
openai = [
    "jedi==0.20.0",
    "pydantic-ai-harness==0.20.0",
    "pydantic-ai-slim[openai]==2.28.0",
]
serena = ["pydantic-ai-slim[mcp]==2.28.0"]
onebot = ["nonebot-adapter-onebot>=2.4,<2.5"]
discord = ["nonebot-adapter-discord>=1.1,<1.2"]

[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["nbtriage", "nonebot_plugin_triage"]

[dependency-groups]
maintainer = [
    "markdown-it-py==4.2.0",
    "mlflow==3.14.0",
    "pydantic-ai-slim[openai]==2.28.0",
    "tree-sitter==0.25.2",
    "tree-sitter-typescript==0.23.2",
]
dev = [
    "commitizen>=4.1.0,<5.0.0",
    "git-cliff>=2.11.0,<3.0.0",
    { include-group = "test" },
    "nb-cli>=1.4.2,<2.0.0",
    "prek>=0.2.0,<1.0.0",
    "pydantic-ai-slim[anthropic,openai]==2.28.0",
    "twine>=6.2.0,<7.0.0",
]
test = [
    "basedpyright>=1.31.0",
    "jedi==0.20.0",
    "nonebot-adapter-discord>=1.1,<1.2",
    "nonebot-adapter-onebot>=2.4,<2.5",
    "nonebot2[fastapi]>=2.5,<2.6",
    "nonebug>=0.4.3,<1.0.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.3.0,<1.4.0",
    "pydantic-ai-harness==0.20.0",
    "ruff>=0.14.13,<1.0.0",
]

[tool.nonebot.plugins]
nonebot-plugin-triage = ["nonebot_plugin_triage"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
