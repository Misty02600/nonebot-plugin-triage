name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.11.28"

      - name: Validate tag and version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(uv version --short)"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "v${project_version}" ]]; then
            echo "Expected tag v${project_version}, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "$(git rev-parse HEAD)"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Run quality checks
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync basedpyright
          uv run --no-sync pytest

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate distributions and package isolation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          source_distributions=(dist/*.tar.gz)
          if (( ${#wheels[@]} != 1 || ${#source_distributions[@]} != 1 )); then
            echo "Expected exactly one wheel and one source distribution." >&2
            exit 1
          fi
          uv run --no-sync twine check --strict "${wheels[@]}" "${source_distributions[@]}"
          uv run --no-sync python scripts/verify_distribution_contents.py \
            "${wheels[@]}" "${source_distributions[@]}"
          uv run --isolated --no-project --python "3.12" \
            --with "${wheels[0]}" python scripts/verify_base_wheel.py
          wheel_url="file://${{ github.workspace }}/${wheels[0]}"
          for provider in openai anthropic; do
            uv run --isolated --no-project --python "3.12" \
              --with "nonebot-plugin-triage[model-${provider}] @ ${wheel_url}" \
              python scripts/verify_model_extra.py "${provider}"
          done

      - name: Generate release notes
        run: uv run --no-sync git-cliff --latest --strip header --output release-notes.md

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/p/nonebot-plugin-triage
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.whl \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
