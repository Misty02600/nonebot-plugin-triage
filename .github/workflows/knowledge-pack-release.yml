name: Release knowledge pack

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing knowledge-vYYYY.MM.N tag with a draft release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: knowledge-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify draft assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.11.28"

      - name: Validate independent tag
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^knowledge-v([0-9]{4}\.[0-9]{2}\.[0-9]+)$ ]]; then
            echo "Knowledge releases require knowledge-vYYYY.MM.N tags." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "$(git rev-parse HEAD)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "asset=nbtriage-default-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Install verifier dependencies
        run: uv sync --group maintainer

      - name: Download draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ASSET: ${{ steps.identity.outputs.asset }}
        run: |
          set -euo pipefail
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = "true"
          mkdir candidate
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sha256" \
            --dir candidate

      - name: Verify release candidate
        shell: bash
        env:
          ASSET: ${{ steps.identity.outputs.asset }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          uv run --no-sync python -m tools.nbtriage_maintainer.knowledge_pack verify-package \
            --archive "candidate/${ASSET}" \
            --checksum "candidate/${ASSET}.sha256" \
            --version "${VERSION}" \
            --project-revision "$(git rev-parse HEAD)"

  publish:
    name: Publish verified draft
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish without changing the plugin latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest=false
