name: 功能建议
title: "feat: "
description: 提出与证据优先报障和诊断有关的改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 说明使用场景、当前限制与受影响的人。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、安全边界和可接受的取舍。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选；说明为什么现有能力不足。
